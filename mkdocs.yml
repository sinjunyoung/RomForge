site_name: RomForge 매뉴얼
site_description: Switch / 3DS / Wii U 등 멀티 플랫폼 롬 관리 툴 RomForge 사용 설명서
site_url: https://sinjunyoung.github.io/RomForge/
repo_url: https://github.com/sinjunyoung/RomForge
repo_name: sinjunyoung/RomForge

theme:
  name: material
  language: ko
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: 다크 모드로 전환
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: 라이트 모드로 전환
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - 기능별 매뉴얼:
      - 패치 - 일반: patch-general.md
      - 패치 - 아케이드: patch-arcade.md
      - 압축: compression.md
      - 변환: convert.md
      - Switch - 리팩: switch-unpack-repack.md
      - Switch - 병합: switch-merge.md
      - Switch - 포맷 변환: switch-format.md
      - Switch - 새턴롬 NSP 변환: switch-nsp-convert.md
      - Switch - 버전 무시: switch-version-ignore.md
      - WiiU - 리팩: wiiu-repack.md
      - WiiU - 포맷 변환: wiiu-format.md
      - 3DS - 리팩: 3ds-merge.md
      - 3DS - 설치 - 설치된 게임목록: 3ds-extract.md
      - 3DS - 설치 - 신규 게임 설치: 3ds-pc-install.md
      - 3DS - 포맷 변환: 3ds-format.md
      - 3DS - 복호화: 3ds-decrypt.md
      - PS - PBP 변환: psp-pbp-convert.md
      - PS - PBP 복원: psp-pbp-restore.md
      - PS - 포맷 변환: psp-format.md
  - 유틸리티:
      - 티스토리 다운로더: util-tistory.md
  - 홈: index.md
  - 실행 및 키파일 설정: installation.md
  - 자주 묻는 질문: faq.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
      slugify: !!python/name:pymdownx.slugs.uslugify
